<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Tarjeta de reseñas | Momo's Barbershop</title>
  <style>
    @font-face { font-family: "Ultra"; src: url("assets/fonts/ultra-400.woff2") format("woff2"); }
    @font-face { font-family: "Barlow Condensed"; src: url("assets/fonts/barlow-condensed-800.woff2") format("woff2"); font-weight: 800; }
    @font-face { font-family: "Barlow Condensed"; src: url("assets/fonts/barlow-condensed-600.woff2") format("woff2"); font-weight: 600; }
    @page { size: A6 portrait; margin: 0; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #d9d4ca; font-family: "Barlow Condensed", "Arial Narrow", sans-serif; }
    .hint { max-width: 105mm; margin: 16px auto; text-align: center; font: 600 15px/1.4 system-ui, sans-serif; color: #333; }
    .hint button { margin-top: 8px; padding: 10px 18px; font: 800 15px "Barlow Condensed", sans-serif; letter-spacing: .1em; text-transform: uppercase; background: #0f0f11; color: #d8b67e; border: 0; cursor: pointer; }
    .card {
      width: 105mm; height: 148mm; margin: 0 auto 24px; padding: 8mm;
      background: #0f0f11; color: #f2efe9; text-align: center;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      border: 1.6mm double #d8b67e; outline: 3mm solid #0f0f11;
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    .logo { width: 34mm; height: 34mm; }
    h1 { margin: 0; font: 400 9.5mm/1 "Ultra", Georgia, serif; color: #d8b67e; }
    .sub { margin: 0; font-weight: 800; font-size: 4.2mm; letter-spacing: .12em; text-transform: uppercase; }
    .qr { width: 44mm; height: 44mm; padding: 3mm; background: #fff; }
    .stars { display: flex; gap: 1.5mm; justify-content: center; color: #d8b67e; }
    .stars svg { width: 5mm; height: 5mm; fill: currentColor; }
    .en { margin: 0; font-weight: 600; font-size: 3.6mm; letter-spacing: .1em; text-transform: uppercase; color: #bdb7ab; }
    .thanks { margin: 0; font-weight: 800; font-size: 3.4mm; letter-spacing: .16em; text-transform: uppercase; color: #d8b67e; }
    @media print { body { background: none; } .hint { display: none; } .card { margin: 0; outline: 0; page-break-after: always; } }
  </style>
</head>
<body>
  <div class="hint">Tarjeta tamaño A6 para imprimir y poner en el espejo o en la caja.<br><button type="button" onclick="window.print()">Imprimir</button></div>

    <div>

  </div>

</html>
